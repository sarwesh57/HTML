<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:url("C:\Users\SARWESH\OneDrive\Desktop\HTML2\image\flipkart.jpeg");
            background-size:cover;
        }

        .login-box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:darkblue;
        }

        table{
            width:100%;
        }

        td{
            padding:8px;
        }

        input[type=text],
        input[type=password]{
            width:100%;
            padding:8px;
            border:1px solid gray;
            border-radius:4px;
        }

        .buttons{
            text-align:center;
            margin-top:15px;
        }

        .buttons input{
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
        }

        .login{
            background:green;
            color:white;
        }

        .clear{
            background:red;
            color:white;
        }

        .buttons input:hover{
            opacity:0.9;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>Login Form</h2>

<form action="DETAILS.HTML">

<table>

<tr>
    <td>Username</td>
</tr>

<tr>
    <td>
        <input type="text" name="username" placeholder="Enter Username" required>
    </td>
</tr>

<tr>
    <td>Password</td>
</tr>

<tr>
    <td>
        <input type="password" name="password" placeholder="Enter Password" required>
    </td>
</tr>

</table>

<div class="buttons">

<a href="DETAILS.HTML">
    <input type="button" value="Login" class="login">
</a>

<input type="reset" value="Clear" class="clear">

</div>

</form>

</div>

</body>
</html>

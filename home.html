<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#bbdefb,#e3f2fd,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    color:#0d47a1;
    margin-bottom:10px;
    font-size:38px;
}

p{
    color:#555;
    margin-bottom:30px;
    font-size:18px;
}

.image-card{
    width:420px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    transition:0.4s;
    margin:auto;
}

.image-card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 30px rgba(0,0,0,0.3);
}

.image-card img{
    width:100%;
    height:280px;
    display:block;
}

.image-name{
    background:#0d47a1;
    color:white;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

.image-card a{
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Welcome to Online Shopping System</h1>

<p>Click the Image to Login</p>

<div class="image-card">

<a href="login.html">

<img src="C:\Users\SARWESH\OneDrive\Desktop\HTML2\image\lo.jpg" alt="Online Shopping">

<div class="image-name">
ONLINE SHOPPING
</div>

</a>

</div>

</div>

</body>
</html>

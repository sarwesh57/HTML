<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Video Page</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#0d1b2a,#415a77);
            color:white;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .product-container{
            width:80%;
            max-width:800px;
            background:rgba(255,255,255,0.08);
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom:10px;
        }

        hr{
            width:100px;
            height:2px;
            border:none;
            background:#ffffff;
            margin-bottom:20px;
        }

        p{
            color:#d8e2dc;
        }

        video{
            width:100%;
            max-width:700px;
            border-radius:10px;
            margin-top:20px;
        }

        table{
            width:80%;
            margin:30px auto;
            border-collapse:collapse;
        }

        table,th,td{
            border:1px solid white;
        }

        th,td{
            padding:12px;
        }

        th{
            background:#1b263b;
        }

        .button-group{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:20px;
        }

        .back-btn,
        .next-btn{
            border:none;
            padding:12px 35px;
            font-size:16px;
            color:white;
            border-radius:25px;
            cursor:pointer;
        }

        .back-btn{
            background:#6c757d;
        }

        .back-btn:hover{
            background:#495057;
        }

        .next-btn{
            background:#0077ff;
        }

        .next-btn:hover{
            background:#0056d6;
        }

        a{
            text-decoration:none;
        }
    </style>

</head>
<body>

<div class="product-container">

    <h1>Product Video Page</h1>
    <hr>

    <h3>Product Name : Smart Phone</h3>

    <p>Watch the product demonstration video before purchasing.</p>

    <video controls>
        <source src="C:\Users\SARWESH\OneDrive\Desktop\HTML2\image\video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <table>
        <tr>
            <th>Product</th>
            <th>Brand</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Smart Phone</td>
            <td>Oppo A3 Pro</td>
            <td>₹25,999</td>
        </tr>
    </table>

    <div class="button-group">

        <a href="file:///C:/Users/SARWESH/OneDrive/Desktop/HTML2/EX2/SHOPPING.HTML">
            <button class="back-btn">Back</button>
        </a>

        <a href="logout.html">
            <button class="next-btn">Next</button>
        </a>

    </div>

</div>

</body>
</html>

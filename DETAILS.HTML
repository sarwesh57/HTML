<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Details Form</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#dbeafe;
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#1e3a8a;
}

table{
    width:100%;
}

td{
    padding:8px;
}

input[type=text],
input[type=email],
input[type=tel],
input[type=date],
select,
textarea{
    width:100%;
    padding:8px;
    border:1px solid #999;
    border-radius:5px;
}

textarea{
    resize:none;
}

.buttons{
    text-align:center;
    margin-top:20px;
}

.buttons input{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.reset{
    background:#dc3545;
    color:white;
}

.next{
    background:#28a745;
    color:white;
}

.back{
    background:#007bff;
    color:white;
}

.buttons input:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">

<h2>User Details Form</h2>

<form action="SHOPPING.HTML">

<table>

<tr>
<td>Full Name</td>
<td><input type="text" name="fullname" required></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date" name="dob"></td>
</tr>

<tr>
<td>Phone Number</td>
<td><input type="tel" name="phone"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" name="email"></td>
</tr>

<tr>
<td>Address</td>
<td><textarea rows="3"></textarea></td>
</tr>

<tr>
<td>City</td>
<td><input type="text" name="city"></td>
</tr>

<tr>
<td>State</td>
<td><input type="text" name="state"></td>
</tr>

<tr>
<td>Pincode</td>
<td><input type="text" name="pincode"></td>
</tr>

<tr>
<td>Country</td>
<td>
<select>
<option>India</option>
<option>USA</option>
<option>UK</option>
<option>Canada</option>
<option>Australia</option>
</select>
</td>
</tr>

</table>

<div class="buttons">

<input type="reset" value="Clear" class="reset">

<a href="SHOPPING.HTML">
<input type="button" value="Next" class="next">
</a>

<a href="LOGIN.HTML">
<input type="button" value="Back" class="back">
</a>

</div>

</form>

</div>

</body>
</html>

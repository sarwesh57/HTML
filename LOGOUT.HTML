<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Page</title>
    <style>
       
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #f8fafc;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        
        .logout-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 25px rgba(56, 189, 248, 0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: popup 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popup {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        
        .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(74, 222, 128, 0.15);
            border: 2px solid #4ade80;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: #4ade80;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        h1 {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            border: none;
            margin: 15px 0 20px 0;
        }

        p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .highlight-text {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Buttons Group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Poppins', sans-serif;
        }

        
        .btn-login {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        
        .btn-home {
            background: rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-home:hover {
            background: rgba(148, 163, 184, 0.2);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body onload="alert('Thank You! You have successfully logged out.')">

    <div class="logout-container">
        <!-- Success Icon -->
        <div class="icon-circle">✓</div>

        <h1>Logged Out</h1>
        <h2>Thank You!</h2>
        
        <hr class="divider">
        
        <p>You have successfully logged out of the Online Shopping System.</p>
        <p class="highlight-text">Visit Again!</p>
        
        <div class="button-group">
            <a href="file:///C:/Users/SARWESH/OneDrive/Desktop/HTML2/EX2/home.html">
                <button class="btn btn-login">Login Again</button>
            </a>
            <a href="file:///C:/Users/SARWESH/OneDrive/Desktop/HTML2/EX2/DETAILS.HTML">
                <button class="btn btn-btn-home btn-home">Home</button>
            </a>
        </div>
    </div>

</body>
</html>
